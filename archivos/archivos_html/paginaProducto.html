<!DOCTYPE html>
<html>

    <head>
       <title>Vino Tinto "Viñas de Balbo"</title>
       <link rel="stylesheet" href="../archivos_css/styles2.css">
    </head>


    <body>
        <a class="skip-link" href="#contenido">Saltar al contenido principal</a> <!-- revisar-->



        <!--botones de contacto, menu principal, busqueda y carrito-->
        <div class="page-shell">
           <header id="encabezado" class="site-header">

           </header>




           <main id="contenido">

               <!--boton para volver al catalogo-->
               <section class="content-section" aria-labelledby="producto-titulo">
                   <a class="back-link" href="estructura.html#catalogo">← Volver al catálogo</a>


                   <div class="detail-layout">


                       <!--imagen del producto-->
                       <div class="contenedor-imagen">
                           <img class="detail-image">
                       </div>


                       <!--detalles del producto-->
                       <article class="detail-content">
                           <span class="product-type"></span>
                           <h2 id="producto-titulo"></h2>


                           <p id="descripcion">
                           </p>


                           <p id="precio"></p>


                           <h3>Información del producto</h3>


                           <!--hay alguna forma de listar elementos sin que se vean los puntitos o numeros?-->
                           <ul class="info-list">
                               <li><strong>Presentación:</strong> <span id="presentacion"></span></li>
                               <li><strong>Tipo:</strong> <span id="tipo-lista"></span></li>
                               <li><strong>Variedad:</strong> <span id="variedad"></span></li>
                               <li><strong>Stock disponible:</strong> <span id="stock"></span> unidades</li>
                           </ul>

                           <p><strong>Estado:</strong> <span id="estado"></span></p>
                       </article>
                   </div>
               </section>
           </main>
           <hr/>




        <!--información de contacto-->
           <footer class="site-footer" id="contacto">

           </footer>
        </div>

        <script src="../archivos_js/header.js"></script>
        <script src="../archivos_js/footer.js"></script>
        <script src="../archivos_js/productos.js"></script>
        <script src="../archivos_js/paginaProducto.js"></script>
    </body>
</html>
